orchestrator:
  mode: multiprocessing
  mp_mode: forkserver
  max_ram_per_worker: 2000
  nb_workers: 3
  task_timeout: 600
  max_tasks_per_worker: 10
  dump_to_disk: true
  per_job_timeout: 600
  factorize_tasks: true
input:
  sensors:
    img1:
      image:
        bands:
          b0:
            path: /work/CAMPUS/users/belletva/cars-users-day/cars-users-day/ROI_INDUS/DSM/intermediate_data/subsampling/res_4/img1/stack.tif
            band: 0
          b1:
            path: /work/CAMPUS/users/belletva/cars-users-day/cars-users-day/ROI_INDUS/DSM/intermediate_data/subsampling/res_4/img1/stack.tif
            band: 1
          b2:
            path: /work/CAMPUS/users/belletva/cars-users-day/cars-users-day/ROI_INDUS/DSM/intermediate_data/subsampling/res_4/img1/stack.tif
            band: 2
          b3:
            path: /work/CAMPUS/users/belletva/cars-users-day/cars-users-day/ROI_INDUS/DSM/intermediate_data/subsampling/res_4/img1/stack.tif
            band: 3
        no_data: 0
      geomodel:
        path: /work/CAMPUS/users/belletva/cars-users-day/cars-users-day/ROI_INDUS/img1/RPC_PAN.XML
        model_type: RPC
      mask: null
      classification: null
    img2:
      image:
        bands:
          b0:
            path: /work/CAMPUS/users/belletva/cars-users-day/cars-users-day/ROI_INDUS/DSM/intermediate_data/subsampling/res_4/img2/stack.tif
            band: 0
          b1:
            path: /work/CAMPUS/users/belletva/cars-users-day/cars-users-day/ROI_INDUS/DSM/intermediate_data/subsampling/res_4/img2/stack.tif
            band: 1
          b2:
            path: /work/CAMPUS/users/belletva/cars-users-day/cars-users-day/ROI_INDUS/DSM/intermediate_data/subsampling/res_4/img2/stack.tif
            band: 2
          b3:
            path: /work/CAMPUS/users/belletva/cars-users-day/cars-users-day/ROI_INDUS/DSM/intermediate_data/subsampling/res_4/img2/stack.tif
            band: 3
        no_data: 0
      geomodel:
        path: /work/CAMPUS/users/belletva/cars-users-day/cars-users-day/ROI_INDUS/img2/RPC_PAN.XML
        model_type: RPC
      mask: null
      classification: null
  pairing:
  - - img1
    - img2
  roi: null
  dsm_to_fill: null
  initial_elevation:
    dem: /work/CAMPUS/users/belletva/cars-users-day/cars-users-day/ROI_INDUS/DSM/intermediate_data/surface_modeling/res4/dump_dir/dem_generation/dem_median.tif
    geoid: /softs/projets/3d/jupyter/envs/cars-1.0.0/lib/python3.12/site-packages/cars/pipelines/parameters/../../conf/geoid/egm96.grd
  low_res_dsm: ROI_INDUS/DSM/intermediate_data/surface_modeling/res16/dsm/dsm.tif
  loaders:
    image: pivot
    classification: pivot
  filling:
    fill_with_geoid: null
    interpolate_from_borders: null
    fill_with_endogenous_dem: null
    fill_with_exogenous_dem: null
tie_points:
  applications:
    grid_generation:
      save_intermediate_data: false
      method: epipolar
      epi_step: 30
    resampling:
      save_intermediate_data: false
      method: bicubic
      strip_height: 60
      interpolator_image: bicubic
      interpolator_classif: nearest
      interpolator_mask: nearest
      step: 500
    sparse_matching:
      save_intermediate_data: false
      method: sift
      elevation_delta_lower_bound: -1000
      decimation_factor: 30
      elevation_delta_upper_bound: 9000
      tile_margin: 10
      epipolar_error_upper_bound: 10.0
      epipolar_error_maximum_bias: 50.0
      minimum_nb_matches: 90
      sift_matching_threshold: 0.7
      sift_n_octave: 8
      sift_n_scale_per_octave: 3
      sift_peak_threshold: 4.0
      sift_edge_threshold: 10.0
      sift_magnification: 7.0
      sift_window_size: 2
      sift_back_matching: true
      match_filter_knn: 25
      match_filter_constant: 0.0
      match_filter_mean_factor: 1.3
      match_filter_dev_factor: 3.0
      used_band: b0
      disparity_bounds_estimation:
        activated: true
        percentile: 1
        lower_margin: 500
        upper_margin: 1000
  advanced:
    resampling_tile_width: 5000
    resampling_tile_height: 60
    save_intermediate_data: false
    geometry_plugin: SharelocGeometry
surface_modeling:
  advanced:
    save_intermediate_data: false
    land_cover_map: global_land_cover_map.tif
    keep_low_res_dir: false
    debug_with_roi: false
    classification_to_configuration_mapping: config_mapping.json
    phasing: null
    use_endogenous_dem: true
    dsm_merging_tile_size: 4000
    ground_truth_dsm: {}
    geometry_plugin: SharelocGeometry
    pipeline: default
  applications:
    grid_generation:
      save_intermediate_data: false
      method: epipolar
      epi_step: 30
    grid_correction:
      save_intermediate_data: false
      method: default
      nb_matches: 90
    resampling:
      save_intermediate_data: true
      method: bicubic
      strip_height: 60
      interpolator_image: bicubic
      interpolator_classif: nearest
      interpolator_mask: nearest
      step: 500
    ground_truth_reprojection:
      save_intermediate_data: false
    dense_match_filling:
      save_intermediate_data: false
      method: zero_padding
      classification: null
      fill_valid_pixels: true
    sparse_matching:
      save_intermediate_data: false
    dense_matching:
      performance_map_method:
      - risk
      - intervals
      save_intermediate_data: false
      method: custom
      min_epi_tile_size: 300
      max_epi_tile_size: 1500
      epipolar_tile_margin_in_percent: 60
      classification_fusion_margin: -1
      min_elevation_offset: null
      max_elevation_offset: null
      denoise_disparity_map: false
      confidence_filtering:
        activated: true
        bounds_ratio_threshold: 0.2
        risk_ratio_threshold: 0.75
        bounds_range_threshold: 3
        risk_range_threshold: 9
        nan_threshold: 0.2
        win_nanratio: 20
      disp_min_threshold: null
      disp_max_threshold: null
      perf_eta_max_ambiguity: 0.99
      perf_eta_max_risk: 0.25
      perf_eta_step: 0.04
      perf_ambiguity_threshold: 0.6
      use_cross_validation: fast
      use_global_disp_range: false
      local_disp_grid_step: 10
      disp_range_propagation_filter_size: 50
      epi_disp_grid_tile_size: 800
      required_bands:
      - b0
      used_band: b0
      threshold_disp_range_to_borders: false
      filter_incomplete_disparity_range: true
      generate_ambiguity: false
      loader: pandora
      loader_conf:
        input: {}
        pipeline:
          matching_cost:
            matching_cost_method: census
            window_size: 11
            subpix: 1
            band: b0
          optimization:
            optimization_method: sgm
            overcounting: true
            penalty:
              P1: 20
              P2: 80
              penalty_method: sgm_penalty
          cost_volume_confidence.cars_1:
            confidence_method: ambiguity
            eta_max: 0.99
            eta_step: 0.04
          cost_volume_confidence.cars_2:
            confidence_method: risk
            eta_max: 0.25
            eta_step: 0.04
          cost_volume_confidence.cars_3:
            confidence_method: interval_bounds
          disparity:
            disparity_method: wta
            invalid_disparity: NaN
          refinement:
            refinement_method: vfit
          filter:
            filter_method: median
            filter_size: 3
          validation:
            validation_method: cross_checking_fast
    triangulation:
      save_intermediate_data: false
      method: line_of_sight_intersection
      snap_to_img1: false
    dem_generation:
      save_intermediate_data: false
      method: bulldozer_on_raster
      resolution: 8.0
      margin:
      - 0.1
      - 2000.0
      morphological_filters_size: 30
      preprocessing_median_filter_size: 5
      postprocessing_median_filter_size: 7
      dem_median_downscale: 10
      dem_min_max_downscale: 2
      fillnodata_max_search_distance: 50
      min_dem: -500
      max_dem: 1000
      height_margin: 80.0
      bulldozer_max_object_size: 8
      disable_bulldozer: false
      compute_stats: true
      coregistration: true
      coregistration_max_shift: 180
    point_cloud_outlier_removal.1:
      save_intermediate_data: false
      method: small_components
      on_ground_margin: 11
      connection_distance: 12.0
      nb_points_threshold: 50
      clusters_distance_threshold: null
      half_epipolar_size: 5
    point_cloud_outlier_removal.2:
      save_intermediate_data: false
      method: statistical
      use_median: true
      k: 50
      filtering_constant: 0.0
      mean_factor: 1.3
      std_dev_factor: 3.0
      half_epipolar_size: 5
    pc_denoising:
      save_intermediate_data: false
    point_cloud_rasterization:
      save_intermediate_data: false
      method: simple_gaussian
      dsm_radius: 1
      sigma: null
      grid_points_division_factor: null
      dsm_no_data: -32768
      texture_no_data: null
      texture_dtype: null
      msk_no_data: 255
    auxiliary_filling:
      save_intermediate_data: false
output:
  directory: /work/CAMPUS/users/belletva/cars-users-day/cars-users-day/ROI_INDUS/DSM/intermediate_data/surface_modeling/res4
  auxiliary:
    image:
    - b1
    - b2
    - b3
    performance_map: false
    ambiguity: false
    weights: false
    classification: false
    contributing_pair: false
    filling: false
  epsg: 2154
  geoid: true
  resolution: 2.0
  product_level:
  - dsm
  save_by_pair: false
